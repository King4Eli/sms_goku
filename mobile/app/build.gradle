plugins {
    id "com.android.application"
}

android {
    namespace "com.smsgoku.gateway"
    compileSdk 36

    defaultConfig {
        applicationId "com.smsgoku.gateway"
        minSdk 24
        targetSdk 36
        versionCode appVersionCode.toInteger()
        versionName appVersionName
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
