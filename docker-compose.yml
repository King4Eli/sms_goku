name: sms_goku

services:
  api:
    image: ghcr.io/king4eli/sms_goku/api:${IMAGE_TAG:-latest}
    build: ./api
    container_name: sms_goku_api
    env_file: [.app.env/db.env, .app.env/api.env]
    ports:
      - "10.50.0.1:9060:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    image: ghcr.io/king4eli/sms_goku/web:${IMAGE_TAG:-latest}
    build: ./web
    container_name: sms_goku_web
    depends_on: [api]
    ports:
      - "10.50.0.1:9061:80"
    restart: unless-stopped