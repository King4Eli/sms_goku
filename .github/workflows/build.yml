name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---- Docker images -> GHCR + rg2.vintolab.com ---------------------------
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: .
            file: ./api/Dockerfile
          - name: webui
            context: ./webui
            file: ./webui/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - id: slug
        run: echo "v=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.rg_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ steps.slug.outputs.v }}-${{ matrix.name }}
            rg2.vintolab.com/sms_processing-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ---- signed release APK -> artifact -------------------------------------
  apk:
    runs-on: ubuntu-latest
    environment: android-release
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36"

      - name: Decode release keystore
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::set the KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD repo secrets"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > mobileui/release.jks
          echo "KEYSTORE_FILE=release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: mobileui
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - uses: actions/upload-artifact@v5
        with:
          name: app-release
          path: mobileui/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
