# Secrets (repo -> Settings -> Secrets and variables -> Actions):
#   VPS_HOST     VPS address
#   VPS_USER     SSH user (in docker group)
#   VPS_SSH_KEY  private key; public key in VPS ~/.ssh/authorized_keys
#   VPS_PATH     dir on VPS with docker-compose.yml + .app.env/
# GITHUB_TOKEN is automatic.

name: deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ghcr.io/king4eli/sms_goku/${{ matrix.service }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deploy
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          DIR: ${{ secrets.VPS_PATH }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$SSH_KEY" > key && chmod 600 key
          opts="-i key -o StrictHostKeyChecking=accept-new"
          scp $opts docker-compose.yml "$TARGET:$DIR/"
          ssh $opts "$TARGET" "cd $DIR && echo $TOKEN | docker login ghcr.io -u ${{ github.actor }} --password-stdin && docker compose pull && docker compose up -d --no-build"
